<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 md:p-8 bg-cover bg-center">
    <div class="flex md:w-full md:max-w-4xl sm:shadow overflow-hidden bg-white/80 rounded-2xl">
        <div class="relative hidden md:flex flex-auto items-center justify-center h-full overflow-x-hidden">
            <img src="assets/images/logo/logo.png" style="width: 200px;" class="object-cover" />

        </div>
        <div class="w-full sm:w-auto py-8 px-4 sm:p-12 md:p-16 ">
            <div class="w-full max-w-100 sm:w-90 mx-auto sm:mx-0">

                <!-- Title -->
                <div class="mt-8 text-4xl font-semibold tracking-tight leading-tight md:text-black text-center text-white">ยินดีต้อนรับเข้าสู่ระบบ
                     <p class="text-xl font-light md:text-gray-600 text-gray-600">กรุณาลงชื่อเพื่อเข้าสู่ระบบ</p>
                </div>
                <!-- <div class="flex items-baseline mt-0.5 font-medium md:text-black text-white">
                    <div>กรุณาลงชื่อเพื่อเข้าสู่ระบบ</div>
                </div> -->

                <!-- Alert -->
                <fuse-alert class="mt-8 -mb-4" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type" [@shake]="alert.type === 'error'">
                    {{alert.message}}
                </fuse-alert>

                <!-- Sign in form -->
                <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm">

                    <!-- Username field -->
                    <mat-form-field class="w-full">
                        <mat-label class="md:text-black text-white">Username</mat-label>
                        <input id="usernmae" matInput [formControlName]="'username'">
                        <mat-error *ngIf="signInForm.get('username').hasError('required')">
                            กรุณากรอกชื่อผู้ใช้งาน
                        </mat-error>
                        <mat-error *ngIf="signInForm.get('username').hasError('username')">
                            โปรดกรอกชื่ออผู้ใช้งานที่ถูกต้อง
                        </mat-error>
                    </mat-form-field>

                    <!-- Password field -->
                    <mat-form-field class="w-full">
                        <mat-label  class="md:text-black text-white" >Password</mat-label>
                        <input id="password" matInput type="password" [formControlName]="'password'" #passwordField>
                        <button mat-icon-button type="button" (click)="passwordField.type === 'password' ? passwordField.type = 'text' : passwordField.type = 'password'" matSuffix>
                            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'"
                                [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'"
                                [svgIcon]="'heroicons_solid:eye-off'"></mat-icon>
                        </button>
                        <mat-error>
                           กรุณากรอกรหัสผ่าน
                        </mat-error>
                    </mat-form-field>


                    <!-- Submit button -->
                    <button class="fuse-mat-button-large w-full mt-2" color="primary" mat-flat-button [disabled]="signInForm.disabled" (click)="signIn()">
                        <span *ngIf="!signInForm.disabled">
                          เข้าสู่ระบบ
                        </span>
                        <div *ngIf="signInForm.disabled" class="spinner-overlay" ></div>

                      </button>


                </form>
            </div>
        </div>
    </div>
</div>
