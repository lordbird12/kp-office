<div class="flex flex-col flex-auto min-w-0">
    <!-- Header -->
    <div
        class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 flemin-w-0">
            <!-- Title -->
            <div class="flex flex-row mt-2 justify-between">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate"
                    *ngIf="!this.Id">
                    เพิ่มอะไหล่
                </h2>
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate"
                    *ngIf="this.Id">
                    แก้ไขอะไหล่
                </h2>
            </div>
        </div>
    </div>
    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10">
        <div class="w-full ">
            <form class="bg-card rounded-2xl md:shadow overflow-hidden px-8 pt-6 pb-8 mb-4 flex flex-col my-2"
                [formGroup]="formData">
                <span
                    class="text-xl md:text-xl font-bold tracking-tight leading-7 sm:leading-10 truncate text-gray-500">
                    ข้อมูลอะไหล่
                </span>
                <div class="-mx-3 md:flex mb-6">
                    <div class="md:w-full px-3 mb-6 md:mb-0">
                        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                            <mat-label>หมวดประเภทอะไหล่</mat-label>
                            <mat-select [formControlName]="'category_attribute_id'">
                                <mat-option [value]="''">
                                    <span>เลือกประเภทอะไหล่</span>
                                </mat-option>
                                <mat-option *ngFor="let item of item1Data" [value]="item.id">
                                    {{item.name}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div class="-mx-3 md:flex mb-6">
                    <div class="md:min-w-full px-3 mb-6 md:mb-0">
                        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                            <mat-label>ชื่ออะไหล่</mat-label>
                            <input matInput [formControlName]="'name'" [placeholder]="'ชื่ออะไหล่'">
                        </mat-form-field>
                    </div>
                </div>
                <div class="-mx-3 md:flex mb-6">
                    <div class="md:w-1/3 px-3 mb-6 md:mb-0">
                        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                            <mat-label>จำนวนคงเหลือ</mat-label>
                            <input matInput [placeholder]="'จำนวนคงเหลือ'" [formControlName]="'qty'">
                        </mat-form-field>
                    </div>
                    <div class="md:w-1/3 px-3 mb-6 md:mb-0">
                        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                            <mat-label>ราคาทุน</mat-label>
                            <input matInput [placeholder]="'ต้นทุน'" [formControlName]="'cost'">
                        </mat-form-field>
                    </div>
                    <div class="md:w-1/3 px-3">
                        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                            <mat-label>ราคาขาย</mat-label>
                            <input matInput [placeholder]="'ราคาขาย'" [formControlName]="'sale_price'">
                        </mat-form-field>
                    </div>
                </div>
                <div class="-mx-3 md:flex mb-6">
                    <div class="md:min-w-1/2 px-3 mb-6 md:mb-0">
                        <div class="border-t border-gray-200">
                            <dd class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">
                                <div class=" flex flex-wrap justify-start">
                                    <ngx-dropzone style="width: 100%; height: 280px; justify-content: center;"
                                        (change)="onSelect($event)">
                                        <ngx-dropzone-label>รูปหลัก</ngx-dropzone-label>
                                        <ngx-dropzone-image-preview *ngFor="let f of files" [removable]="true"
                                            [file]="f" (removed)="onRemove(f)">
                                        </ngx-dropzone-image-preview>
                                    </ngx-dropzone>
                                </div>
                            </dd>
                        </div>
                    </div>
                    <div class="md:min-w-1/2 px-3 mb-6 md:mb-0">
                        <div class="grid grid-cols-1">
                            <div class="border rounded-lg overflow-hidden hover:shadow-md transition-shadow">
                                <!-- Image Preview -->
                                <div class="relative aspect-video bg-gray-100 dark:bg-gray-700">
                                    <img [src]="getPath(itemData?.image)" (error)="onImageError($event)"
                                        class="w-full h-full object-cover" alt="ภาพตัวอย่างรถยนต์" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-row mt-2 justify-end">
                    <div class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                        <button class="px-6 ml-3" mat-flat-button [color]="'primary'" (click)="New();">
                            บันทึก
                        </button>
                        <button class="px-6 ml-3" mat-flat-button [color]="'warn'" (click)="backTo()">
                            ยกเลิก
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
