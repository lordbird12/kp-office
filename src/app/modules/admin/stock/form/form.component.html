<div class="flex flex-col flex-auto min-w-0">
    <!-- Header Section -->
    <div
        class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-4 sm:p-6 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <!-- Dynamic Title -->
                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-gray-800 dark:text-white truncate">
                    {{ isForm ? 'สร้างคำสั่งซื้อ' : 'แก้ไขคำสั่งซื้อ' }}
                </h2>

                <!-- Status Update Button -->
                <button mat-flat-button color="primary" class="w-full sm:w-auto">
                    <mat-icon>update</mat-icon>
                    <span class="ml-1">อัปเดตสถานะ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="p-4 sm:p-6 space-y-6 w-full">
        <!-- Remark Field -->
        <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
            <mat-label>หมายเหตุ</mat-label>
            <textarea matInput formControlName="remark" placeholder="ระบุเหตุผลการเบิกสินค้า" rows="2"></textarea>
            <mat-error *ngIf="requestForm.get('remark')?.invalid && requestForm.get('remark')?.touched">
                กรุณาระบุหมายเหตุ
            </mat-error>
        </mat-form-field>

        <!-- Items Section -->
        <mat-card class="shadow-sm">
            <mat-card-header class="border-b w-full">
                <div class="flex justify-between items-center w-full mb-4">
                    <span class="text-lg font-medium">รายการสินค้า</span>
                    <button type="button" (click)="addItem()" mat-stroked-button color="primary" class="!text-sm">
                        <mat-icon class="!text-base">add</mat-icon>
                        <span>เพิ่มรายการ</span>
                    </button>
                </div>
            </mat-card-header>

            <mat-card-content>
                <!-- Items List -->
                <div formArrayName="items" class="space-y-4 mt-4">
                    <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i"
                        class="grid grid-cols-1 sm:grid-cols-12 gap-4 p-4 rounded-lg border bg-gray-50 dark:bg-gray-800">

                        <!-- Product Attribute ID -->
                        <mat-form-field [ngClass]="formFieldHelpers" class="sm:col-span-5">
                            <mat-label>รหัสสินค้า</mat-label>
                            <input matInput type="number" formControlName="product_attribute_id">
                            <mat-error *ngIf="item.get('product_attribute_id')?.invalid">
                                กรุณาระบุรหัสสินค้า
                            </mat-error>
                        </mat-form-field>

                        <!-- Quantity -->
                        <mat-form-field [ngClass]="formFieldHelpers" class="sm:col-span-3">
                            <mat-label>จำนวน</mat-label>
                            <input matInput type="number" min="1" formControlName="qty">
                            <mat-error *ngIf="item.get('qty')?.invalid">
                                กรุณาระบุจำนวนที่ถูกต้อง
                            </mat-error>
                        </mat-form-field>

                        <!-- Remove Button -->
                        <div class="sm:col-span-2 flex items-center sm:justify-end">
                            <button type="button" (click)="removeItem(i)" mat-icon-button color="warn"
                                matTooltip="ลบรายการ" class="!h-10 !w-10">
                                <mat-icon>delete_outline</mat-icon>
                            </button>
                        </div>

                        <!-- Step Jobs Type (only show on desktop) -->
                        <mat-form-field [ngClass]="formFieldHelpers" class="sm:col-span-6 hidden sm:block">
                            <mat-label>ขั้นตอนงาน</mat-label>
                            <input matInput type="number" formControlName="step_jobs_type_list_id">
                        </mat-form-field>

                        <!-- Work Type (only show on desktop) -->
                        <mat-form-field [ngClass]="formFieldHelpers" class="sm:col-span-6 hidden sm:block">
                            <mat-label>ประเภทงาน</mat-label>
                            <input matInput type="number" formControlName="work_type_id">
                        </mat-form-field>

                        <!-- Additional Fields for Mobile -->
                        <div class="sm:hidden space-y-4 col-span-12">
                            <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                                <mat-label>ขั้นตอนงาน</mat-label>
                                <input matInput type="number" formControlName="step_jobs_type_list_id">
                            </mat-form-field>

                            <mat-form-field [ngClass]="formFieldHelpers" class="w-full">
                                <mat-label>ประเภทงาน</mat-label>
                                <input matInput type="number" formControlName="work_type_id">
                            </mat-form-field>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div *ngIf="items.controls.length === 0" class="text-center py-8 text-gray-500">
                        <mat-icon class="text-4xl opacity-50">inventory_2</mat-icon>
                        <p class="mt-2">ไม่มีรายการสินค้า</p>
                        <button type="button" (click)="addItem()" mat-button color="primary" class="mt-2">
                            <mat-icon>add</mat-icon>
                            เพิ่มรายการแรก
                        </button>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>

        <!-- Submit Button -->
        <div class="sticky bottom-0 bg-white dark:bg-gray-900 py-4 border-t -mx-4 sm:-mx-6 px-4 sm:px-6 mt-6">
            <button type="submit" mat-raised-button color="primary" class="w-full sm:w-auto sm:min-w-[200px]"
                [disabled]="requestForm.invalid">
                <mat-icon>save</mat-icon>
                <span>{{ isForm ? 'บันทึกคำขอเบิกสินค้า' : 'อัปเดตคำขอเบิกสินค้า' }}</span>
            </button>
        </div>
    </form>
</div>
