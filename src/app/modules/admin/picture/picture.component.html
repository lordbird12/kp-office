<div class="flex flex-col flex-auto md:w-160 md:min-w-160 -m-6">
    <ng-container *ngIf="imgSelected; else noImage">
        <img [src]="imgSelected" (error)="handleImageError()" />
    </ng-container>
    <ng-template #noImage>
        <div class="flex items-center justify-center w-full h-full p-8">
            <span class="text-lg">ไม่พบรูปภาพ</span>
        </div>
    </ng-template>
</div>
